entry_schema:
  discrepancy_id: "string; required; unique within this log"
  rq_id: "RQ-01"
  record_kind: "migration_discrepancy | source_issue | intellectual_issue"
  artifact_id: "STR-P01-RQ01"
  source_path: "authoritative source repository path"
  source_baseline_sha: "immutable Git baseline"
  source_hash: "source SHA-256 or Git blob"
  target_path: "candidate repository path"
  source_identity: "source path, baseline and hash/blob identity"
  candidate_identity: "candidate path plus SHA-256 or Git/worktree identity"
  class: "A | B | C | D | E | F | G | H | I | J | K | L | M | N | O"
  secondary_classes: "list; may be empty"
  severity: "S0 | S1 | S2 | S3 | S4 | S5 | null for faithfully preserved source/intellectual issues"
  fidelity_effect: "blocking | non_blocking | undetermined"
  source_location: "source section, paragraph, list item, table/cell or other stable anchor"
  target_location: "candidate heading, line, block, table/cell or other stable anchor"
  source_observation: "factual observation in source"
  target_observation: "factual observation in candidate"
  migration_fidelity_risk: "specific representation risk; separate from intellectual quality"
  evidence: "list of source/target observations, hashes, renderings or comparisons"
  detected_by: "actor identity"
  detected_date: "YYYY-MM-DD"
  detection_stage: "conversion | operator_check | independent_review | re_review"
  owner: "actor responsible for the next routed action"
  correction_required: "boolean"
  correction_authority: "automatic | operator_with_review | human_review | adjudication | controlled_revision_only"
  correction_by: "actor identity or null"
  correction_date: "YYYY-MM-DD or null"
  verification_required: "boolean"
  verification_by: "actor identity or null; cannot be material correction author"
  verification_date: "YYYY-MM-DD or null"
  proposed_disposition: "approved taxonomy routing or terminal disposition"
  accepted_disposition: "accepted terminal/routing disposition or null"
  disposition_type: "routing | terminal"
  disposition_status: "proposed | accepted | rejected | superseded"
  disposition_by: "actor identity or null"
  disposition_date: "YYYY-MM-DD or null"
  disposition_history: "append-only list of proposed, routing, downstream and terminal decisions"
  record_status: "detected | classified | correction_required | corrected | verified | disposition_pending | adjudication_required | deferred | resolved"
  resolution_evidence: "evidence of closure or null"
  intellectual_issue_status: "observed | recorded | deferred | handed_off | null"
  adjudication_required: "boolean"
  adjudication_reference: "traceable decision reference or null"
  downstream_decision_reference: "downstream decision reference or null"
  controlled_revision_reference: "controlled revision reference or null"

