 # migration/MIGRATION_MANIFEST.yaml

manifest:
  project: "Strategy Knowledge System"
  area: "Strategy Knowledge Book"
  part: "Part 01 — Strategy"
  purpose: "Machine-readable migration inventory for source research artifacts."
  migration_stage: "context-transfer"
  status: "in-progress"

governance:
  migration_principle:
    - preservation
    - faithful_representation
    - structural_normalization
    - validation
    - improvement

  source_priority_during_migration:
    - original_research_artifact
    - migration_summary
    - conversation_recollection

  canonical_policy:
    current_historical_baseline: "DOCX"
    intended_future_working_format: "Markdown"
    markdown_is_canonical_immediately_after_conversion: false
    canonical_promotion_requires_fidelity_validation: true

  intellectual_revision_during_migration: false

  discrepancy_policy:
    silent_reconciliation_allowed: false
    record_material_discrepancies: true

paths:
  part_root: "knowledge-books/strategy/part-01"

  source_docx:
    current: "knowledge-books/strategy/part-01/source-docx/current"
    meta: "knowledge-books/strategy/part-01/source-docx/meta"
    superseded: "knowledge-books/strategy/part-01/source-docx/superseded"

  future_markdown:
    chapters: "knowledge-books/strategy/part-01/chapters"
    reviews: "knowledge-books/strategy/part-01/reviews"
    registers: "knowledge-books/strategy/part-01/registers"
    migration: "knowledge-books/strategy/part-01/migration"

migration_status_values:
  - not_started
  - copied
  - conversion_pending
  - converted
  - fidelity_review
  - fidelity_pass
  - fidelity_fail
  - canonical_candidate
  - canonical

artifact_status_values:
  - current
  - meta
  - superseded

