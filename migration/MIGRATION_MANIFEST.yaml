migration_package:
  files:
    - path: "migration/MIGRATION_PLAN.md"
      role: "migration procedure and sequencing"
      expected_status: "created"

    - path: "migration/PROJECT_CONTEXT.md"
      role: "stable project context"
      expected_status: "created"

    - path: "migration/PROJECT_STATE.md"
      role: "migration-time project state snapshot"
      expected_status: "created"

    - path: "migration/METHODOLOGY_STATE.md"
      role: "preserved methodology snapshot"
      expected_status: "created"

    - path: "migration/ARCHITECTURE_DECISIONS.md"
      role: "architecture decision register"
      expected_status: "created"

    - path: "migration/OPEN_QUESTIONS.md"
      role: "consolidated unresolved-question register"
      expected_status: "created"

    - path: "migration/MIGRATION_MANIFEST.yaml"
      role: "machine-readable migration inventory"
      expected_status: "created"

next_gate:
  name: "Migration Package Integrity Review"

  checks:
    - "All migration package files exist."
    - "All current DOCX source artifacts listed in this manifest exist at declared repository paths."
    - "The superseded RQ-03 v1 artifact exists in the superseded directory."
    - "No original source DOCX has been modified as part of migration."
    - "Manifest filenames match actual filenames exactly."
    - "Manifest paths match actual repository structure."
    - "No Markdown research chapter has been declared canonical."
    - "Known open questions and architecture decisions remain preserved."
    - "Repository instructions are internally consistent."
    - "Migration and intellectual revision remain separated."

  after_pass:
    - "Commit migration package and source DOCX baseline."
    - "Run Codex read-only repository comprehension test."
    - "Resolve repository/bootstrap discrepancies only."
    - "Define RQ-01 fidelity audit procedure."
    - "Begin controlled RQ-01 DOCX-to-Markdown migration pilot."

  prohibited_before_pass:
    - "Bulk DOCX-to-Markdown migration."
    - "Part 01 intellectual revision."
    - "Canonical promotion of converted chapters."
    - "Native Part 02 research."
    - "Automatic resolution of Open Questions."